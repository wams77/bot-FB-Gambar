name: Auto Aesthetic Bible Image Bot

on:
  schedule:
    # Berjalan otomatis setiap 2 jam sekali (pada menit ke-0)
    - cron: '0 */2 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-aesthetic-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow groq beautifulsoup4

      - name: Jalankan Bot Galeri
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }} 
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bible_image_bot.py

      - name: Simpan Memori Bot (Anti-Duplikasi)
        run: |
          git config --global user.name 'Bot Editor AI'
          git config --global user.email 'bot@actions.github.com'
          
          touch history_verses.txt
          
          git add history_verses.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "update memori ayat alkitab"
          git push
